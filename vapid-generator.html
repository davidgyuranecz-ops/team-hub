<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAPID kulcsgenerátor</title><style>body{font:17px system-ui;max-width:650px;margin:40px auto;padding:20px;background:#faf8f4;color:#222}button,textarea{font:inherit;padding:12px;box-sizing:border-box}textarea{width:100%;height:100px;overflow-wrap:anywhere}button{margin:10px 0}label{display:block;margin-top:20px} </style><h1>VAPID kulcsgenerátor</h1><p>A kulcsok helyben készülnek. Nincs hálózati kérés. A privát kulcsot ne oszd meg.</p><button id="gen">Kulcspár generálása</button><p id="status"></p><label for="pub">VAPID_PUBLIC_KEY</label><textarea id="pub" readonly></textarea><label for="priv">VAPID_PRIVATE_KEY</label><textarea id="priv" readonly></textarea><script>const el=id=>document.getElementById(id);const enc=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');el('gen').onclick=async()=>{try{if(!globalThis.crypto?.subtle)throw Error('A böngésző ebben a megnyitási módban nem támogatja a Web Crypto API-t.');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const pub=await crypto.subtle.exportKey('raw',pair.publicKey);const priv=await crypto.subtle.exportKey('jwk',pair.privateKey);el('pub').value=enc(pub);el('priv').value=priv.d;el('status').textContent='Elkészült. Mentsd mindkét kulcsot a Supabase-be.';el('gen').disabled=true;}catch(e){el('status').textContent=e.message;}};</script></html>
