<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VAPID v2</title><style>body{font:16px system-ui;max-width:680px;margin:30px auto;padding:20px}textarea{width:100%;box-sizing:border-box;font:16px monospace}button{padding:12px;margin:10px 0}</style><h1>VAPID kulcsgenerátor v2</h1><button id="gen">Kulcspár generálása</button><p id="status" role="status"></p><label>VAPID_PUBLIC_KEY<textarea id="pub" rows="3" readonly></textarea></label><label>VAPID_PRIVATE_KEY<textarea id="priv" rows="2" readonly></textarea></label><script>'use strict';const g=id=>document.getElementById(id);const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');g('gen').onclick=async()=>{g('gen').disabled=true;try{const c=crypto.subtle;const k=await c.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const raw=await c.exportKey('raw',k.publicKey);const jwk=await c.exportKey('jwk',k.privateKey);const p=await c.importKey('raw',raw,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const msg=new TextEncoder().encode('VAPID verification');const sig=await c.sign({name:'ECDSA',hash:'SHA-256'},k.privateKey,msg);if(!await c.verify({name:'ECDSA',hash:'SHA-256'},p,sig,msg)||raw.byteLength!==65||jwk.d.length!==43)throw Error('Ellenőrzési hiba');g('pub').value=b64(raw);g('priv').value=jwk.d;g('status').textContent='Sikeres P-256 aláírás-ellenőrzés. Mindkét kulcs elkészült.';}catch(e){g('status').textContent='Hiba: '+e.message;g('gen').disabled=false;}};</script></html>
