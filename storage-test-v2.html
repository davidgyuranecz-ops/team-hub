<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thediamonds • Storage API teszt</title><style>body{font:16px system-ui;background:#f4eee7;color:#302c29;max-width:640px;margin:24px auto;padding:16px}section{background:white;padding:20px;border-radius:16px}input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;font:inherit;border:1px solid #d9cbbd;border-radius:10px}button{background:#71543a;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Storage API teszt</h1><p>279/I4.12h • v2 • Elkülönített munkamenet</p><section><form id="login"><select id="role"><option>member</option><option>leader</option><option>admin</option><option>inactive</option></select><input id="email" type="email" placeholder="E-mail" required><input id="pw" type="password" placeholder="Jelszó" required><button>Belépés és teszt</button></form><pre id="out"></pre></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id); const log=s=>$('out').textContent+=s+'\n';
$('login').onsubmit=async e=>{e.preventDefault();$('out').textContent='';const button=e.target.querySelector('button');button.disabled=true;let c;try{const cfg=JSON.parse(localStorage.getItem('thediamondsAuthConfig')||'null');if(!cfg||!cfg.url||!cfg.key)throw Error('Nincs helyi konfiguráció. Nyisd meg az eredeti Team Hubot ugyanebben a böngészőben.');if(new URL(cfg.url).origin!=='https://xfxrextgkdpluvnzdnrc.supabase.co')throw Error('Nem a várt projekt.');let safe=cfg.key.startsWith('sb_publishable_');if(!safe){try{safe=JSON.parse(atob(cfg.key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon'}catch{}}if(!safe)throw Error('Csak nyilvános kulcs használható.');c=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'td-storage-test-isolated'}});const {data,error}=await c.auth.signInWithPassword({email:$('email').value,password:$('pw').value});$('pw').value='';if(error)throw error;const r=await c.from('profiles').select('role,status').eq('id',data.user.id).single();if(r.error)throw r.error;const role=$('role').value;if(role==='inactive' ? (r.data.role!=='member'||r.data.status!=='inactive') : (r.data.role!==role||r.data.status!=='active'))throw Error('Nem a kiválasztott aktív szerepkör.');log('Szerepkör: '+r.data.role+'; státusz: '+r.data.status);const b=c.storage.from('team-covers');const paths=['media/38a02c7a-dfc7-4d3c-906b-cbfc0143cd5a/663cb848-db2f-4893-b599-7357a07bd6f7.png','media/38a02c7a-dfc7-4d3c-906b-cbfc0143cd5a/87733b7f-00d3-4d59-9a69-16c1d95c161e.jpg'];let ok=0,denied=0;for(let i=0;i<paths.length;i++){const x=await b.createSignedUrl(paths[i],60);if(!x.error&&x.data?.signedUrl){const f=await fetch(x.data.signedUrl,{cache:'no-store'});if(f.ok){ok++;log('Kép '+(i+1)+': HTTP '+f.status);continue}log('Kép '+(i+1)+': HTTP '+f.status)}else{denied++;log('Kép '+(i+1)+': URL kiadása elutasítva ('+(x.error?.message||'ismeretlen')+')')}}log('Elérhető: '+ok+'/2; elutasított URL: '+denied);const canvas=document.createElement('canvas');canvas.width=canvas.height=16;const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const path='media/'+data.user.id+'/'+crypto.randomUUID()+'.png';log('Eldobható tesztfájl: '+path);const up=await b.upload(path,blob,{contentType:'image/png',upsert:false});if(up.error){log('Feltöltés elutasítva: '+up.error.message);log('Feltöltés: '+((role==='member'||role==='inactive')?'ELVÁRT ELUTASÍTÁS (SQL ellenőrzés szükséges)':'FAIL'));}else{log('Feltöltés sikeres: '+((role==='member'||role==='inactive')?'FAIL':'PASS'));const del=await b.remove([path]);log('Törlés API válasz: '+(del.error?del.error.message:'visszaadott objektumok: '+(del.data?.length??0)));log('A törlés eredményét SQL-ben ellenőrizzük.');}log('Olvasási számlálás: '+(ok===(role==='inactive'?0:role==='member'?1:2)&&denied===(role==='inactive'?2:role==='member'?1:0)?'PASS':'FAIL'));}catch(err){log('HIBA: '+err.message)}finally{$('pw').value='';if(c)await c.auth.signOut({scope:'local'}).catch(()=>{});button.disabled=false;}};
</script></html>
